<style>
:root{
  color-scheme:light;
  --bg:#DCE1E7; --surface:#F1F3F6; --ink:#1B2026; --muted:#566170; --line:#C6CDD6;
  --head:#2F5D73; --head-ink:#FFFFFF; --head-muted:#C5D8E2;
  --accent:#2F5D73; --bar:#3E7690; --track:#CBD3DC; --soft:#E3EAF0;
  --bad:#B3392F; --good:#2E7D4F; --chip:#E3E8EE;
  --font-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --font-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--font-body);overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--head);z-index:30}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--head-ink);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.top h1{font:700 18px/1.1 var(--font-display);margin:0}
.top .who{font-size:12px;color:var(--head-muted);font-family:var(--font-mono);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#8bd3a5;display:inline-block}
.dot.off{background:#f0b35a}.dot.sync{background:#c5d8e2}
main{max-width:560px;margin:0 auto;display:grid;gap:12px;align-content:start;
  padding-top:14px;padding-bottom:calc(100px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;min-width:0}
.panel h2{font:700 16px/1.2 var(--font-display);margin:0 0 10px}
.lbl{font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--font-mono)}
input,select{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%;min-width:0;font-size:16px}
.btn{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-weight:600}
.btn.ghost{background:none;border:1px solid var(--line);color:var(--ink)}
.btn.sm{padding:8px 12px;font-size:14px}
.btn.bad{background:var(--bad)}
.btn.full{width:100%}
.btn:disabled{opacity:.55}
.row{display:flex;gap:8px;align-items:center}
.row>*{min-width:0}
.grow{flex:1}
.stack{display:grid;gap:10px}
.total{font:700 32px/1.1 var(--font-display)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.acerto{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line)}
.acerto:first-of-type{border-top:0}
.acerto.me{font-weight:600}
.val{font-family:var(--font-mono);font-weight:500;white-space:nowrap}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:right;font-weight:600;padding:0 0 6px}
th:first-child,td:first-child{text-align:left}
td{padding:7px 0;border-top:1px solid var(--line);text-align:right;font-family:var(--font-mono);font-size:13px}
td:first-child{font-family:var(--font-body);font-size:14px}
.pos{color:var(--good)}.neg{color:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;background:var(--bar)}
.day{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:6px 2px 0}
.item{display:flex;gap:12px;align-items:center;padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;width:100%;text-align:left}
.item2{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.chip.ok{background:#DCEFE3;border-color:#9CCDAE;color:#1F5F3A}
.chip.pend{background:#F6E6D0;border-color:#E0BE8C;color:#6B4510}
.item .ic{font-size:22px;width:30px;text-align:center}
.item .t{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .s{font-size:12.5px;color:var(--muted)}
.item .r{text-align:right}
.item .r small{display:block;font-size:11.5px;color:var(--muted);font-family:var(--font-mono)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px)}
nav .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
nav button{background:none;border:0;padding:10px 0 9px;color:var(--muted);font-size:12px;font-weight:600;display:grid;gap:2px;justify-items:center}
nav button b{font-size:20px;line-height:1}
nav button.on{color:var(--accent)}
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(72px + env(safe-area-inset-bottom,0px));z-index:21;
  background:var(--accent);color:#fff;border:0;border-radius:999px;padding:14px 20px;font-weight:600;box-shadow:0 6px 18px rgba(0,0,0,.25)}
.ov{position:fixed;inset:0;background:rgba(20,28,36,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
.sheet h2{font:700 18px/1.2 var(--font-display);margin:0 0 12px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg button{background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:10px;font-weight:600}
.seg button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.prev{background:var(--soft);border-radius:10px;padding:10px 12px;font-size:14px}
.err{color:var(--bad);font-size:14px}
.bigbtn{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px;font-weight:600;font-size:16px}
</style>
</head><body>
<header class="top"><div class="top-in"><h1>Chile 🇨🇱 · Gastos</h1><div class="who" id="who"></div></div></header>
<main id="main"></main>
<nav id="nav" hidden><div class="in">
  <button data-tab="gastos"><b>🧾</b>Gastos</button>
  <button data-tab="resumo"><b>👥</b>Casais</button>
  <button data-tab="config"><b>⚙️</b>Ajustes</button>
</div></nav>
<div class="ov" id="ov" hidden><div class="sheet" id="sheet"></div></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CFG0 = {casais:[{id:'c1',nome:'Casal 1'},{id:'c2',nome:'Casal 2'},{id:'c3',nome:'Casal 3'}],cotacao:5.8};

const ls = {
  get(k, d){ try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

// ---- convite por link: ?u=<url do app da web>&c=<código>
(function(){
  const p = new URLSearchParams(location.search);
  if (p.get('u') && p.get('c')) { ls.set('cl_api', p.get('u')); ls.set('cl_code', p.get('c')); }
  manterConvite();
})();
// O ícone da tela de início (iPhone) abre o endereço que estava na tela e não compartilha
// a memória do Safari: por isso o convite fica no endereço e o manifest aponta para ele.
function manterConvite(){
  const u = ls.get('cl_api', ''), c = ls.get('cl_code', '');
  if (!u || !c) return;
  const q = '?u=' + encodeURIComponent(u) + '&c=' + encodeURIComponent(c);
  if (location.search !== q) history.replaceState(null, '', location.pathname + q);
  // sem manifest o iPhone usa o endereço atual (com o convite) no ícone da tela de início
  const link = document.querySelector('link[rel=manifest]'); if (link) link.remove();
}

const S = {
  lastErr: '',
  api: ls.get('cl_api', ''), code: ls.get('cl_code', ''), me: ls.get('cl_me', ''),
  cfg: ls.get('cl_cfg', null), rows: ls.get('cl_rows', []), outbox: ls.get('cl_outbox', []),
  tab: 'gastos', sync: 'sync', err: '', form: null, loaded: false
};

// ---------- formatação
const brl = n => (+n || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
const clp = n => Math.round(+n || 0).toLocaleString('es-CL') + ' CLP';
const nomeCasal = id => (S.cfg.casais.find(c => c.id === id) || {nome:'?'}).nome;
const hoje = () => new Date().toLocaleDateString('sv-SE');
function parseNum(str, moeda){
  let s = String(str || '').replace(/\s/g, '');
  if (moeda === 'CLP') return parseInt(s.replace(/\D/g, ''), 10) || 0;
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  return parseFloat(s) || 0;
}
function fmtDia(d){
  try { return new Date(d + 'T12:00:00').toLocaleDateString('pt-BR', {weekday:'short', day:'2-digit', month:'2-digit'}); }
  catch(e){ return d; }
}

// ---------- cálculo: saldo corrido entre os casais (cada compra abate o que o outro deve)
const lista = v => (Array.isArray(v) ? v : String(v || '').split(',')).map(x => String(x).trim()).filter(Boolean);
const EPS = 0.05; // diferenças de até 5 centavos (arredondamento) contam como zero
function calc(rows){
  const ids = S.cfg.casais.map(c => c.id);
  const m = {}; ids.forEach(a => { m[a] = {}; ids.forEach(b => m[a][b] = 0); }); // m[a][b] = quanto a deve a b (bruto)
  const gastoPor = {}; ids.forEach(i => gastoPor[i] = 0);
  let total = 0; const acertos = [];
  rows.filter(r => !r.deletado).forEach(r => {
    const v = +r.valorBRL || 0;
    if (r.tipo === 'acerto') {
      const para = lista(r.dividir)[0];
      if (ids.includes(r.pagador) && ids.includes(para) && para !== r.pagador) { m[r.pagador][para] -= v; acertos.push(r); }
      return;
    }
    if (r.tipo !== 'gasto') return;
    const part = lista(r.dividir).filter(x => ids.includes(x));
    if (!part.length || !ids.includes(r.pagador)) return;
    total += v; gastoPor[r.pagador] += v;
    const pagos = lista(r.pagos), cota = v / part.length; // "pagos" = marcações antigas, já quitadas
    part.filter(d => d !== r.pagador && !pagos.includes(d)).forEach(d => { m[d][r.pagador] += cota; });
  });
  // líquido por par: um valor só, já abatido
  const pares = [], saldo = {}; ids.forEach(i => saldo[i] = 0);
  ids.forEach((a, x) => ids.slice(x + 1).forEach(b => {
    const n = m[a][b] - m[b][a];
    if (n > 0) pares.push({de:a, para:b, v:n}); else if (n < 0) pares.push({de:b, para:a, v:-n});
    saldo[a] -= n; saldo[b] += n;
  }));
  // tira dívidas em círculo (A deve B, B deve C, C deve A): o menor valor se cancela nos três
  const acha = (de, para) => pares.find(p => p.de === de && p.para === para && p.v > EPS);
  for (const p1 of pares) for (const p2 of pares) {
    if (p1.v <= EPS || p2.v <= EPS || p2.de !== p1.para) continue;
    const p3 = acha(p2.para, p1.de); if (!p3) continue;
    const v = Math.min(p1.v, p2.v, p3.v); p1.v -= v; p2.v -= v; p3.v -= v;
  }
  for (let i = pares.length - 1; i >= 0; i--) if (pares[i].v <= EPS) pares.splice(i, 1);
  // sugestão mais simples: menos transferências possível, a partir do saldo de cada um
  const dev = ids.filter(i => saldo[i] < -EPS).map(i => ({id:i, v:-saldo[i]})).sort((x, y) => y.v - x.v);
  const cre = ids.filter(i => saldo[i] > EPS).map(i => ({id:i, v:saldo[i]})).sort((x, y) => y.v - x.v);
  const simples = [];
  for (let x = 0, y = 0; x < dev.length && y < cre.length;) {
    const v = Math.min(dev[x].v, cre[y].v);
    if (v > EPS) simples.push({de:dev[x].id, para:cre[y].id, v});
    dev[x].v -= v; cre[y].v -= v;
    if (dev[x].v <= EPS) x++; if (cre[y].v <= EPS) y++;
  }
  ids.forEach(i => { if (Math.abs(saldo[i]) <= EPS) saldo[i] = 0; });
  return {total, pares, saldo, gastoPor, acertos, m, simples};
}

// ---------- rede
// traduz falhas do Google em instruções
function explicar(msg, html, status){
  const t = String(html || '').replace(/<[^>]+>/g, ' ').replace(/\s+/g, ' ').trim();
  const all = msg + ' ' + t;
  if (/Failed to fetch|Load failed|NetworkError|Sign in|Fazer login|accounts\.google|Faça login/i.test(all))
    return 'O Google bloqueou o acesso. No Apps Script: Implantar > Gerenciar implantações > ✏️ e deixe "Executar como: Eu" e "Quem pode acessar: Qualquer pessoa" (não "com conta do Google"). Se estiver sem internet, ignore.';
  if (/Script function not found|doGet|doPost/i.test(all))
    return 'O endereço não tem o código do app. Cole o Code.gs no Apps Script e crie uma "Nova versão" da implantação.';
  if (/getSheetByName|null|openById|não foi possível|Unable to open|permiss|authoriz|autoriza/i.test(all))
    return 'O script não consegue abrir a planilha. No editor do Apps Script rode a função "configurar" (autorize) e depois Implantar > Gerenciar implantações > ✏️ > Versão: "Nova versão". Detalhe: ' + (msg || t).slice(0, 160);
  if (status === 400 || /unable to open the file/i.test(all))
    return 'O servidor está com o código antigo. Cole o Code.gs novo no Apps Script e faça Implantar > Gerenciar implantações > ✏️ > Versão: "Nova versão" > Implantar.';
  if (t) return 'HTTP ' + (status || '?') + ' · resposta inesperada do Google: ' + t.slice(0, 200);
  return msg;
}
const pronto = m => Object.assign(new Error(m), {pronto:true});
let flushing = false;
function setSync(s){ S.sync = s; const d = $('#dot'); if (d) d.className = 'dot ' + (s === 'ok' ? '' : s); }
async function flush(){
  if (flushing || !S.api) return;
  flushing = true;
  try {
    while (S.outbox.length) {
      const p = S.outbox[0];
      const r = await fetch(S.api, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({...p, c:S.code})});
      const txt = await r.text(); let j;
      try { j = JSON.parse(txt); } catch(pe) { throw pronto(explicar('', txt, r.status)); }
      if (!j.ok && j.erro === 'codigo') { S.err = 'Código incorreto.'; break; }
      if (!j.ok && j.erro === 'servidor') throw pronto(explicar(j.detalhe || '', '', 200));
      S.outbox.shift(); ls.set('cl_outbox', S.outbox);
    }
  } catch(e) { S.lastErr = e && e.pronto ? e.message : explicar(String((e && e.message) || e)); setSync('off'); }
  flushing = false;
}
async function load(){
  if (!S.api || !S.code) { render(); return; }
  await flush();
  try {
    setSync('sync');
    const r = await fetch(S.api + (S.api.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(S.code), {cache:'no-store'});
    const txt = await r.text(); let j;
    try { j = JSON.parse(txt); } catch(pe) { throw pronto(explicar('', txt, r.status)); }
    if (!j.ok) {
      if (j.erro === 'codigo' && j.info) S.lastErr = explicar('', '', 400); // servidor antigo: não recebeu o código
      else if (j.erro === 'codigo') { S.err = 'Código incorreto. Confira com quem criou o app.'; S.code = ''; ls.set('cl_code', ''); }
      else S.lastErr = explicar(j.detalhe || ('erro ' + j.erro));
      setSync('off'); render(); return;
    }
    S.lastErr = '';
    S.err = '';
    if (!S.outbox.length) {
      S.cfg = j.config; S.rows = j.linhas;
      ls.set('cl_cfg', S.cfg); ls.set('cl_rows', S.rows);
      if (S.draft && S.draft.novo && !S.draft.valor && !S.draft.desc) S.draft = novoDraft();
    }
    S.loaded = true; setSync('ok');
  } catch(e) { S.lastErr = e && e.pronto ? e.message : explicar(String((e && e.message) || e)); setSync('off'); }
  const ae = document.activeElement;
  if (!S.form && !(ae && /INPUT|SELECT/.test(ae.tagName))) render();
}
function enviar(payload){
  S.outbox.push(payload); ls.set('cl_outbox', S.outbox);
  flush().then(load);
}
function salvarLinha(l){
  const i = S.rows.findIndex(r => r.id === l.id);
  if (i >= 0) S.rows[i] = l; else S.rows.push(l);
  ls.set('cl_rows', S.rows);
  enviar({acao:'salvar', linha:l});
}
function apagarLinha(id){
  const r = S.rows.find(x => x.id === id); if (r) r.deletado = true;
  ls.set('cl_rows', S.rows);
  enviar({acao:'apagar', id});
}
const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 5);

// ---------- telas
function render(){
  $('#who').innerHTML = S.api && S.code ? `<span id="dot" class="dot ${S.sync === 'ok' ? '' : S.sync}"></span>${S.cfg && S.me ? esc(nomeCasal(S.me)) : ''}` : '';
  const main = $('#main'); const ready = S.api && S.code;
  $('#nav').hidden = !(ready && S.me);
  if (S.cfg && !S.draft) S.draft = novoDraft(); else if (S.draft && S.draft.novo && !S.draft.valor && !S.draft.desc) { S.draft.pagador = S.draft.pagador || S.me; }
  if (!ready) { main.innerHTML = telaConectar(); return; }
  if (!S.cfg) { main.innerHTML = `<div class="panel stack"><div class="muted">${S.sync === 'off' ? (S.lastErr ? '⚠️ Não consegui falar com a planilha.' : '📴 Sem conexão com a planilha. Conecte à internet para entrar pela primeira vez.') : 'Carregando…'}</div>${S.lastErr ? `<div class="err" style="word-break:break-word;font-size:13px">${esc(S.lastErr)}</div>` : ''}<button class="btn ghost" data-act="atualizar">Tentar de novo</button><button class="btn ghost" data-act="sair">Trocar endereço / código</button></div>`; return; }
  if (!S.me) { main.innerHTML = telaQuem(); return; }
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  main.innerHTML = S.tab === 'resumo' ? telaResumo() : S.tab === 'gastos' ? telaGastos() : telaConfig();
}
function telaConectar(){
  return `<div class="panel stack"><h2>Conectar ao grupo</h2>
    <p class="muted" style="margin:0">Se alguém te mandou o <b>link de convite</b>, é só abrir ele. Se você está configurando pela primeira vez, cole abaixo o endereço do app da web do Google e o código.</p>
    <div><div class="lbl">Link de convite ou endereço do app (/exec)</div><input id="in-api" placeholder="cole aqui o link de convite" value="${esc(S.api)}" autocapitalize="off" autocorrect="off"></div>
    <div><div class="lbl">Código do grupo (não precisa se colou o link de convite)</div><input id="in-code" placeholder="código" autocapitalize="off" autocorrect="off"></div>
    ${S.err ? `<div class="err">${esc(S.err)}</div>` : ''}
    <button class="btn full" data-act="conectar">Conectar</button></div>`;
}
function telaQuem(){
  return `<div class="panel stack"><h2>Quem é você?</h2>
    <p class="muted" style="margin:0">Escolha o seu casal. Ele vai aparecer como padrão em "quem pagou".</p>
    ${S.cfg.casais.map(c => `<button class="bigbtn" data-act="eu" data-id="${esc(c.id)}">${esc(c.nome)}</button>`).join('')}</div>`;
}
function aviso(){
  if (!S.outbox.length && S.sync !== 'off') return '';
  if (S.lastErr && S.sync === 'off') return `<div class="panel err" style="font-size:13px;word-break:break-word">⚠️ ${esc(S.lastErr)}${S.outbox.length ? '<br>⏳ ' + S.outbox.length + ' lançamento(s) guardado(s) neste aparelho.' : ''}</div>`;
  return `<div class="panel muted" style="font-size:13px">${S.sync === 'off' ? '📴 Sem conexão. ' : ''}${S.outbox.length ? '⏳ ' + S.outbox.length + ' lançamento(s) salvo(s) neste aparelho, sobem sozinhos quando voltar o sinal.' : 'Você pode continuar lançando; sincroniza quando voltar o sinal.'}</div>`;
}
function telaResumo(){
  const c = calc(S.rows), sel = S.sel || S.me;
  const linhaPar = p => `<div class="acerto ${p.de === S.me || p.para === S.me ? 'me' : ''}"><div class="grow" style="min-width:0">
      <div><b>${esc(nomeCasal(p.de))}</b> <span class="muted">deve a</span> <b>${esc(nomeCasal(p.para))}</b></div></div>
      <div class="val neg">${brl(p.v)}</div>
      <button class="btn sm" data-act="acertar" data-de="${esc(p.de)}" data-para="${esc(p.para)}" data-v="${p.v.toFixed(2)}">Pagar</button></div>`;
  const ext = S.cfg.casais.filter(k => k.id !== sel).map(k => {
    const deve = c.m[sel][k.id], recebe = c.m[k.id][sel];
    if (Math.abs(deve) <= EPS && Math.abs(recebe) <= EPS) return '';
    return `<tr><td>${esc(k.nome)}</td><td>${brl(recebe)}</td><td>${brl(deve)}</td><td class="${recebe - deve > EPS ? 'pos' : recebe - deve < -EPS ? 'neg' : ''}">${brl(Math.abs(recebe - deve) <= EPS ? 0 : recebe - deve)}</td></tr>`;
  }).join('');
  const acs = c.acertos.slice().sort((a, b) => (b.data || '').localeCompare(a.data || '') || String(b.id).localeCompare(String(a.id)));
  return `${aviso()}
  <div class="panel"><div class="lbl">Total gasto pelo grupo</div><div class="total">${brl(c.total)}</div></div>
  <div class="panel"><h2>Quem paga quem</h2>
    ${c.pares.length ? c.pares.map(linhaPar).join('') : '<div class="muted">Tudo acertado ✅ Ninguém deve nada.</div>'}
    <div class="muted" style="font-size:12px;margin-top:8px">Já está tudo abatido: o que um casal gasta pelo outro desconta do que ele devia. Quando transferirem, toque em “Pagar” para registrar (pode ser só uma parte).</div></div>
  <div class="panel"><h2>Saldo de cada casal</h2>
    <table><tr><th>Casal</th><th>Pagou</th><th>Saldo</th></tr>
    ${S.cfg.casais.map(k => `<tr><td>${esc(k.nome)}</td><td>${brl(c.gastoPor[k.id])}</td><td class="${c.saldo[k.id] > 0.005 ? 'pos' : c.saldo[k.id] < -0.005 ? 'neg' : ''}">${c.saldo[k.id] > 0.005 ? '+' : ''}${brl(c.saldo[k.id])}</td></tr>`).join('')}</table>
    <div class="muted" style="font-size:12px;margin-top:6px">Saldo positivo = tem a receber · negativo = deve.</div></div>
  <div class="panel"><h2>Conta corrente</h2><div class="chips" style="margin-bottom:12px">${S.cfg.casais.map(k => `<button class="chip ${k.id === sel ? 'on' : ''}" data-act="sel" data-id="${esc(k.id)}">${esc(k.nome)}</button>`).join('')}</div>
    ${ext ? `<table><tr><th>Com</th><th>A receber</th><th>A pagar</th><th>Saldo</th></tr>${ext}</table>
      <div class="muted" style="font-size:12px;margin-top:6px">Já descontando os pagamentos registrados. Saldo positivo = ${esc(nomeCasal(sel))} recebe.</div>` : '<div class="muted">Nenhum movimento ainda.</div>'}</div>
  <div class="panel"><h2>Pagamentos registrados</h2>
    ${acs.length ? acs.map(r => `<div class="acerto"><div class="grow" style="min-width:0"><div>${esc(nomeCasal(r.pagador))} → ${esc(nomeCasal(lista(r.dividir)[0]))}</div>
      <div class="s" style="font-size:12.5px;color:var(--muted)">${esc(fmtDia(r.data))}</div></div><div class="val">${brl(r.valorBRL)}</div>
      <button class="btn ghost sm" data-act="acerto-apagar" data-id="${esc(r.id)}">Desfazer</button></div>`).join('') : '<div class="muted">Nenhum ainda.</div>'}</div>
  ${c.simples.length && c.simples.length < c.pares.length ? `<div class="panel"><h2>Sugestão mais simples</h2>
    <div class="muted" style="font-size:13px;margin-bottom:4px">Dá para zerar todo mundo com ${c.simples.length} transferência${c.simples.length > 1 ? 's' : ''} em vez de ${c.pares.length}:</div>
    ${c.simples.map(linhaPar).join('')}
    <div class="muted" style="font-size:12px;margin-top:8px">O resultado final é o mesmo para cada casal. Registre os pagamentos por aqui ou por “Quem paga quem”, não pelos dois.</div></div>` : ''}`;
}
function abrirAcerto(de, para, v){
  S.form = {acerto:true, de, para};
  $('#sheet').innerHTML = `<h2>Registrar pagamento</h2><div class="stack">
    <div class="prev"><b>${esc(nomeCasal(de))}</b> paga para <b>${esc(nomeCasal(para))}</b></div>
    <div><div class="lbl">Valor transferido (R$)</div><input id="a-valor" inputmode="decimal" value="${String(v).replace('.', ',')}"></div>
    <div class="muted" style="font-size:12.5px">Saldo atual: ${brl(+v)}. Pode pagar só uma parte; o resto continua em aberto.</div>
    <div><div class="lbl">Data</div><input id="a-data" type="date" value="${hoje()}"></div>
    <div class="err" id="a-err"></div>
    <div class="row"><button class="btn full grow" data-act="acerto-salvar">Registrar</button><button class="btn ghost" data-act="form-fechar">Fechar</button></div></div>`;
  $('#ov').hidden = false;
}
function telaGastos(){
  const top = aviso() + `<div class="panel">${formHTML(S.draft, true)}</div>`;
  const rows = S.rows.filter(r => !r.deletado && r.tipo === 'gasto').sort((a, b) => (b.data || '').localeCompare(a.data || '') || String(b.id).localeCompare(String(a.id)));
  if (!rows.length) return top + '<div class="panel muted">Nenhum gasto lançado ainda.</div>';
  let out = top, dia = '';
  rows.forEach(r => {
    if (r.data !== dia) { dia = r.data; out += `<div class="day">${esc(fmtDia(dia))}</div>`; }
    const part = lista(r.dividir);
    out += `<div class="item2"><button class="item" data-act="editar" data-id="${esc(r.id)}" style="border:0;background:none;padding:0"><div class="grow" style="min-width:0">
      <div class="t">${esc(r.descricao || 'Gasto')}</div><div class="s">${esc(nomeCasal(r.pagador))} pagou · ${brl((+r.valorBRL || 0) / (part.length || 1))} p/ cada um de ${part.length}</div></div>
      <div class="r"><span class="val">${brl(r.valorBRL)}</span>${r.moeda === 'CLP' ? `<small>${clp(r.valor)}</small>` : ''}</div></button>
      </div>`;
  });
  return out;
}
function telaConfig(){
  return `<div class="panel stack"><h2>Casais</h2>
    ${S.cfg.casais.map(c => `<input data-nome="${esc(c.id)}" value="${esc(c.nome)}" aria-label="Nome do casal">`).join('')}
    <div><div class="lbl">Cotação padrão (R$ por 1.000 pesos chilenos)</div><input id="in-cot" inputmode="decimal" value="${String(S.cfg.cotacao).replace('.', ',')}"></div>
    <button class="btn full" data-act="salvar-cfg">Salvar para todos</button></div>
  <div class="panel stack"><h2>Meu casal</h2>
    <div class="chips">${S.cfg.casais.map(c => `<button class="chip ${c.id === S.me ? 'on' : ''}" data-act="eu" data-id="${esc(c.id)}">${esc(c.nome)}</button>`).join('')}</div></div>
  <div class="panel stack"><h2>Convidar</h2>
    <p class="muted" style="margin:0">Mande este link no grupo. Quem abrir já entra conectado, sem digitar nada.</p>
    <button class="btn full" data-act="convite">Copiar / compartilhar link de convite</button>
    <button class="btn ghost full" data-act="atualizar">Atualizar agora</button>
    <button class="btn ghost full" data-act="sair">Sair deste aparelho</button></div>`;
}

// ---------- formulário
function abrirForm(r){
  const rate = S.cfg.cotacao || 0;
  S.form = r ? {id:r.id, desc:r.descricao || '', moeda:r.moeda || 'BRL',
      valor: r.moeda === 'CLP' ? String(Math.round(r.valor)) : String(r.valor).replace('.', ','),
      cot: String(r.cotacao || rate).replace('.', ','), real:'', pagador:r.pagador, dividir:lista(r.dividir), pagos:lista(r.pagos), data:r.data || hoje(), novo:false}
    : novoDraft();
  desenharForm();
}
function novoDraft(){
  return {id:novoId(), desc:'', moeda:'CLP', valor:'', cot:String(S.cfg.cotacao || 0).replace('.', ','), real:'',
    pagador:S.me, dividir:S.cfg.casais.map(c => c.id), pagos:[], data:hoje(), novo:true};
}
function previa(f){
  const v = parseNum(f.valor, f.moeda);
  if (f.moeda === 'BRL') return v ? `Vai contar como ${brl(v)}` : '';
  const real = parseNum(f.real, 'BRL'), cot = parseNum(f.cot, 'BRL');
  if (!v) return '';
  if (real > 0) return `${clp(v)} = ${brl(real)} (cobrado de fato · ${(real / v * 1000).toFixed(2).replace('.', ',')} por 1.000)`;
  return cot ? `≈ ${brl(v * cot / 1000)} (cotação ${String(cot).replace('.', ',')} por 1.000 CLP)` : 'Informe a cotação ou o valor cobrado em R$';
}
function formHTML(f, inline){
  return `<h2>${f.novo ? 'Novo gasto' : 'Editar gasto'}</h2><div class="stack">
    <div class="row"><div class="grow" style="flex:2"><div class="lbl">O que foi</div><input id="f-desc" placeholder="Ex.: jantar no restaurante" value="${esc(f.desc)}"></div>
    <div class="grow"><div class="lbl">Valor ${f.moeda === 'CLP' ? '(CLP)' : '(R$)'}</div><input id="f-valor" inputmode="${f.moeda === 'CLP' ? 'numeric' : 'decimal'}" value="${esc(f.valor)}" placeholder="${f.moeda === 'CLP' ? '45000' : '0,00'}"></div></div>
    <div class="seg"><button class="${f.moeda === 'CLP' ? 'on' : ''}" data-act="f-moeda" data-id="CLP">Pesos (CLP)</button><button class="${f.moeda === 'BRL' ? 'on' : ''}" data-act="f-moeda" data-id="BRL">Reais (R$)</button></div>
    ${f.moeda === 'CLP' ? `<div class="row"><div class="grow"><div class="lbl">Cotação (R$ por 1.000)</div><input id="f-cot" inputmode="decimal" value="${esc(f.cot)}"></div>
      <div class="grow"><div class="lbl">Cobrado em R$ (opcional)</div><input id="f-real" inputmode="decimal" placeholder="com taxas/IOF" value="${esc(f.real)}"></div></div>` : ''}
    <div class="prev" id="f-prev">${esc(previa(f)) || 'Informe o valor'}</div>
    <div><div class="lbl">Quem pagou</div><div class="chips" style="margin-top:6px">${S.cfg.casais.map(c => `<button class="chip ${f.pagador === c.id ? 'on' : ''}" data-act="f-pagador" data-id="${esc(c.id)}">${esc(c.nome)}</button>`).join('')}</div></div>
    <div><div class="lbl">Dividir entre</div><div class="chips" style="margin-top:6px">${S.cfg.casais.map(c => `<button class="chip ${f.dividir.includes(c.id) ? 'on' : ''}" data-act="f-div" data-id="${esc(c.id)}">${esc(c.nome)}</button>`).join('')}</div></div>
    <div><div class="lbl">Data</div><input id="f-data" type="date" value="${esc(f.data)}"></div>
    <div class="err" id="f-err"></div>
    <div class="row"><button class="btn full grow" data-act="form-salvar">${f.novo ? 'Lançar gasto' : 'Salvar'}</button>${inline ? '' : (f.novo ? '' : '<button class="btn bad" data-act="form-apagar">Apagar</button>') + '<button class="btn ghost" data-act="form-fechar">Fechar</button>'}</div></div>`;
}
function desenharForm(){
  $('#sheet').innerHTML = formHTML(S.form, false);
  $('#ov').hidden = false;
}
function fecharForm(){ S.form = null; $('#ov').hidden = true; render(); }
function salvarForm(f, root){
  const v = parseNum(f.valor, f.moeda), err = root.querySelector('#f-err');
  if (v <= 0) { err.textContent = 'Informe o valor.'; return; }
  if (!f.dividir.length) { err.textContent = 'Escolha ao menos um casal para dividir.'; return; }
  let brlv = v, cot = '';
  if (f.moeda === 'CLP') {
    const real = parseNum(f.real, 'BRL'), c = parseNum(f.cot, 'BRL');
    if (real > 0) { brlv = real; cot = Math.round(real / v * 1000 * 10000) / 10000; }
    else if (c > 0) { brlv = Math.round(v * c / 1000 * 100) / 100; cot = c; }
    else { err.textContent = 'Informe a cotação ou o valor cobrado em R$.'; return; }
  }
  const pagos = f.pagos.filter(x => f.dividir.includes(x) && x !== f.pagador);
  salvarLinha({id:f.id, tipo:'gasto', data:f.data, descricao:f.desc.trim() || 'Gasto', categoria:'', pagador:f.pagador, moeda:f.moeda,
    valor:v, cotacao:cot, valorBRL:brlv, dividir:f.dividir.join(','), por:S.me, deletado:false, pagos:pagos.join(',')});
  if (root.id === 'sheet') fecharForm(); else { S.draft = novoDraft(); render(); window.scrollTo(0, 0); }
}

// ---------- eventos
document.addEventListener('input', e => {
  const root = e.target.closest('#sheet') || e.target.closest('#main'); if (!root) return;
  const f = root.id === 'sheet' ? S.form : S.draft; if (!f) return;
  const m = {'f-desc':'desc', 'f-valor':'valor', 'f-cot':'cot', 'f-real':'real', 'f-data':'data'}[e.target.id];
  if (!m) return;
  f[m] = e.target.value;
  const p = root.querySelector('#f-prev'); if (p) p.textContent = previa(f) || 'Informe o valor';
});
document.addEventListener('click', async e => {
  const nav = e.target.closest('[data-tab]');
  if (nav) { S.tab = nav.dataset.tab; render(); window.scrollTo(0, 0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act, id = el.dataset.id, inSheet = !!el.closest('#sheet'), f = inSheet ? S.form : S.draft;
  const redraw = () => inSheet ? desenharForm() : render();
  if (act === 'conectar') {
    let u = $('#in-api').value.trim(), c = $('#in-code').value.trim();
    try { const q = new URL(u).searchParams; if (q.get('u') && q.get('c')) { u = q.get('u'); c = q.get('c'); } } catch(e4) {}
    if (!/^https:\/\/script\.google\.com\//.test(u) || !c) { S.err = 'Preencha o endereço (https://script.google.com/…) e o código.'; render(); return; }
    if (!/\/exec\/?$/.test(u)) { S.err = /\/dev\/?$/.test(u) ? 'Esse é o endereço de teste (/dev), que só funciona para você. Use o da implantação, que termina em /exec.' : 'Use o endereço do "App da Web", que termina em /exec (Implantar > Gerenciar implantações).'; render(); return; }
    S.api = u; S.code = c; S.err = ''; ls.set('cl_api', u); ls.set('cl_code', c); manterConvite(); load();
  }
  else if (act === 'eu') { S.me = id; ls.set('cl_me', id); render(); }
  else if (act === 'sel') { S.sel = id; render(); }
  else if (act === 'pago') {
    const r = S.rows.find(x => x.id === id); if (!r) return;
    const c = el.dataset.c, pg = lista(r.pagos);
    r.pagos = (pg.includes(c) ? pg.filter(x => x !== c) : [...pg, c]).join(',');
    salvarLinha(r); render();
  }
  else if (act === 'acertar') abrirAcerto(el.dataset.de, el.dataset.para, el.dataset.v);
  else if (act === 'acerto-salvar') {
    const v = Math.round(parseNum($('#a-valor').value, 'BRL') * 100) / 100, d = $('#a-data').value || hoje();
    if (!(v > 0)) { $('#a-err').textContent = 'Informe o valor.'; return; }
    const f = S.form;
    salvarLinha({id:novoId(), tipo:'acerto', data:d, descricao:'Pagamento', categoria:'', pagador:f.de, moeda:'BRL', valor:v, cotacao:'', valorBRL:v, dividir:f.para, por:S.me, deletado:false, pagos:''});
    fecharForm();
  }
  else if (act === 'acerto-apagar') { if (el.dataset.arm !== '1') { el.dataset.arm = '1'; el.textContent = 'Confirmar?'; return; } apagarLinha(id); render(); }
  else if (act === 'editar') { const r = S.rows.find(x => x.id === id); if (r) abrirForm(r); }
  else if (act === 'salvar-cfg') {
    const cfg = JSON.parse(JSON.stringify(S.cfg));
    document.querySelectorAll('[data-nome]').forEach(i => { const c = cfg.casais.find(x => x.id === i.dataset.nome); if (c && i.value.trim()) c.nome = i.value.trim(); });
    const cot = parseNum($('#in-cot').value, 'BRL'); if (cot > 0) cfg.cotacao = cot;
    S.cfg = cfg; ls.set('cl_cfg', cfg); enviar({acao:'config', config:cfg}); render();
    el.textContent = 'Salvo ✓'; setTimeout(() => { if (el.isConnected) el.textContent = 'Salvar para todos'; }, 1500);
  }
  else if (act === 'convite') {
    const link = location.origin + location.pathname + '?u=' + encodeURIComponent(S.api) + '&c=' + encodeURIComponent(S.code);
    try { if (navigator.share) await navigator.share({title:'Gastos Chile', text:'Entra aqui pra lançar os gastos da viagem:', url:link}); else { await navigator.clipboard.writeText(link); el.textContent = 'Link copiado ✓'; } }
    catch(err) { try { await navigator.clipboard.writeText(link); el.textContent = 'Link copiado ✓'; } catch(e2) { prompt('Copie o link:', link); } }
  }
  else if (act === 'atualizar') { load(); }
  else if (act === 'sair') { if (el.dataset.arm !== '1') { el.dataset.arm = '1'; el.textContent = 'Toque de novo para sair'; return; } ['cl_api','cl_code','cl_me','cl_cfg','cl_rows','cl_outbox'].forEach(k => { try { localStorage.removeItem(k); } catch(e3){} }); location.href = location.pathname; }
  else if (act === 'f-moeda') { if (f.moeda !== id) { f.moeda = id; f.valor = ''; f.real = ''; redraw(); } }
  else if (act === 'f-pagador') { f.pagador = id; redraw(); }
  else if (act === 'f-div') { f.dividir = f.dividir.includes(id) ? f.dividir.filter(x => x !== id) : [...f.dividir, id]; redraw(); }
  else if (act === 'form-salvar') salvarForm(f, inSheet ? $('#sheet') : $('#main'));
  else if (act === 'form-fechar') fecharForm();
  else if (act === 'form-apagar') {
    if (el.dataset.arm !== '1') { el.dataset.arm = '1'; el.textContent = 'Confirmar?'; return; }
    apagarLinha(f.id); fecharForm();
  }
});

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
window.addEventListener('online', () => load());
window.addEventListener('offline', () => { setSync('off'); if (!S.form) render(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden && !S.form) load(); });
setInterval(() => { if (!document.hidden && !S.form) load(); }, 30000);
render(); load();
</script>
</body></html>
